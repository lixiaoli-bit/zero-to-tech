<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>拖拽上传文件夹</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f5;
      font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(200, 215, 255, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 60%, rgba(215, 200, 255, 0.25) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }

    .folder-drop-zone {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 25px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      border: 2px dashed rgba(160, 160, 180, 0.25);
      transition: all 0.3s ease;
      cursor: pointer;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.04);
    }

    .folder-drop-zone.dragover {
      border-color: #7a6ab0;
      background: rgba(200, 185, 240, 0.15);
      box-shadow: 0 0 0 4px rgba(120, 100, 200, 0.08);
      transform: scale(1.01);
    }

    .folder-drop-zone.dragover .folder-svg {
      filter: drop-shadow(0 0 40px rgba(120, 100, 200, 0.2));
    }

    .folder-svg {
      display: block;
      width: 100%;
      max-width: 320px;
      height: auto;
      transition: transform 0.3s ease, filter 0.3s ease;
      filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.06));
      pointer-events: none;
    }

    .folder-drop-zone:hover .folder-svg {
      transform: scale(1.02) rotate(-0.5deg);
    }

    .hint-text {
      margin-top: 12px;
      font-size: 14px;
      color: #8888a0;
      letter-spacing: 0.5px;
      user-select: none;
      pointer-events: none;
    }

    .hint-text span {
      background: rgba(180, 180, 200, 0.15);
      padding: 2px 12px;
      border-radius: 12px;
      font-weight: 500;
      color: #6a6a82;
    }

    .file-list {
      width: 100%;
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .file-list::-webkit-scrollbar {
      width: 4px;
    }
    .file-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .file-list::-webkit-scrollbar-thumb {
      background: #d0d0dd;
      border-radius: 4px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      border: 1px solid rgba(200, 200, 215, 0.2);
      transition: all 0.25s ease;
      animation: slideIn 0.3s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .file-item:hover {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(180, 180, 210, 0.3);
      transform: translateX(4px);
    }

    @keyframes slideIn {
      0% { opacity: 0; transform: translateY(-8px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .file-icon {
      font-size: 22px;
      flex-shrink: 0;
      width: 36px;
      text-align: center;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }
    .file-name {
      font-size: 14px;
      font-weight: 500;
      color: #2a2a3a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-size {
      font-size: 12px;
      color: #9999ae;
      margin-top: 2px;
    }

    .file-delete {
      background: none;
      border: none;
      font-size: 18px;
      color: #c0c0d0;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: all 0.2s;
      line-height: 1;
    }
    .file-delete:hover {
      color: #e06060;
      background: rgba(224, 96, 96, 0.08);
    }

    .empty-hint {
      text-align: center;
      color: #b0b0c5;
      font-size: 13px;
      padding: 20px 0 8px;
      letter-spacing: 0.3px;
    }

    .clear-btn {
      margin-top: 10px;
      padding: 6px 18px;
      background: rgba(200, 200, 215, 0.15);
      border: none;
      border-radius: 20px;
      color: #9999ae;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .clear-btn:hover {
      background: rgba(224, 96, 96, 0.08);
      color: #e06060;
    }

    .clear-btn.hidden {
      display: none;
    }

    .file-count {
      font-size: 12px;
      color: #b0b0c5;
      margin-top: 6px;
    }

    @media (max-width: 480px) {
      .folder-drop-zone { padding: 20px 16px; }
      .folder-svg { max-width: 220px; }
      .file-item { padding: 10px 12px; }
      .file-name { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="folder-drop-zone" id="dropZone">
      <svg class="folder-svg" viewBox="0 0 400 280" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g filter="url(#fShadow)">
          <path d="M48 100 L48 255 Q48 272 65 272 L335 272 Q352 272 352 255 L352 100 L48 100 Z" fill="url(#fBack)" stroke="rgba(200,200,215,0.3)" stroke-width="1" />
          <path d="M48 100 L48 255 Q48 272 65 272 L335 272 Q352 272 352 255 L352 100 L48 100 Z" fill="url(#fFront)" stroke="rgba(220,220,235,0.3)" stroke-width="0.8" />
        </g>
        <g filter="url(#cShadow)">
          <path d="M48 100 L48 100 L105 65 L345 65 Q362 65 362 82 L362 100 L48 100 Z" fill="url(#cGrad)" stroke="rgba(210,210,225,0.25)" stroke-width="1" />
          <path d="M105 65 L345 65 Q362 65 362 82 L362 92 L48 92 L48 100 L105 65 Z" fill="url(#cShine)" opacity="0.5" />
        </g>
        <g filter="url(#lShadow)">
          <rect x="130" y="115" width="140" height="35" rx="9" ry="9" fill="url(#lGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
          <text x="200" y="138" font-family="'Segoe UI','PingFang SC',system-ui,sans-serif" font-size="13" font-weight="500" fill="#4a4a5a" letter-spacing="2" text-anchor="middle" dominant-baseline="middle">我的文件夹</text>
        </g>
        <g opacity="0.12">
          <rect x="80" y="165" width="180" height="4" rx="2" fill="#8a8a9a" />
          <rect x="80" y="183" width="140" height="4" rx="2" fill="#8a8a9a" />
          <rect x="80" y="201" width="200" height="4" rx="2" fill="#8a8a9a" />
          <rect x="80" y="219" width="110" height="4" rx="2" fill="#8a8a9a" />
        </g>
        <circle cx="300" cy="128" r="2.8" fill="#b0b0c0" opacity="0.35" />
        <circle cx="78" cy="138" r="2.2" fill="#b0b0c0" opacity="0.25" />
        <defs>
          <linearGradient id="fBack" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e8e8ee" /><stop offset="100%" stop-color="#d5d5dd" />
          </linearGradient>
          <linearGradient id="fFront" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0%" stop-color="#f5f5f8" /><stop offset="50%" stop-color="#ececf0" /><stop offset="100%" stop-color="#e0e0e6" />
          </linearGradient>
          <linearGradient id="cGrad" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0%" stop-color="#fafaff" /><stop offset="60%" stop-color="#f0f0f5" /><stop offset="100%" stop-color="#e5e5eb" />
          </linearGradient>
          <linearGradient id="cShine" x1="0" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" /><stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="lGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f0f0f5" /><stop offset="100%" stop-color="#e2e2e8" />
          </linearGradient>
          <filter id="fShadow" x="-5%" y="-5%" width="115%" height="120%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#a0a0b0" flood-opacity="0.08" />
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#9090a0" flood-opacity="0.04" />
          </filter>
          <filter id="cShadow" x="-5%" y="-12%" width="115%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a0a0b0" flood-opacity="0.06" />
          </filter>
          <filter id="lShadow" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#b0b0c0" flood-opacity="0.06" />
          </filter>
        </defs>
      </svg>

      <div class="hint-text">
        <span>📥 拖拽文件到此处 或 点击上传</span>
      </div>
      <div class="file-count" id="fileCount">暂无文件</div>
    </div>

    <div class="file-list" id="fileList">
      <div class="empty-hint">✨ 拖入文件开始整理</div>
    </div>

    <button class="clear-btn hidden" id="clearBtn">🗑 清空全部</button>
  </div>

  <script>
    (function() {
      const dropZone = document.getElementById('dropZone');
      const fileList = document.getElementById('fileList');
      const fileCount = document.getElementById('fileCount');
      const clearBtn = document.getElementById('clearBtn');

      let files = [];

      function getFileIcon(name) {
        const ext = name.split('.').pop().toLowerCase();
        const map = {
          'pdf': '📄', 'doc': '📘', 'docx': '📘', 'xls': '📗', 'xlsx': '📗',
          'ppt': '📙', 'pptx': '📙', 'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️',
          'gif': '🖼️', 'webp': '🖼️', 'svg': '🖼️', 'mp4': '🎬', 'avi': '🎬',
          'mov': '🎬', 'mkv': '🎬', 'mp3': '🎵', 'wav': '🎵', 'flac': '🎵',
          'zip': '📦', 'rar': '📦', '7z': '📦', 'tar': '📦', 'gz': '📦',
          'js': '📜', 'ts': '📜', 'py': '📜', 'java': '📜', 'cpp': '📜',
          'c': '📜', 'go': '📜', 'rs': '📜', 'html': '🌐', 'css': '🎨',
          'json': '📋', 'xml': '📋', 'txt': '📝', 'md': '📝'
        };
        return map[ext] || '📎';
      }

      function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
      }

      function render() {
        fileList.innerHTML = '';
        if (files.length === 0) {
          fileList.innerHTML = '<div class="empty-hint">✨ 拖入文件开始整理</div>';
          fileCount.textContent = '暂无文件';
          clearBtn.classList.add('hidden');
          return;
        }

        clearBtn.classList.remove('hidden');
        fileCount.textContent = files.length + ' 个文件';

        files.forEach((file, index) => {
          const item = document.createElement('div');
          item.className = 'file-item';

          const icon = document.createElement('span');
          icon.className = 'file-icon';
          icon.textContent = getFileIcon(file.name);

          const info = document.createElement('div');
          info.className = 'file-info';
          info.innerHTML = `
            <div class="file-name" title="${file.name}">${file.name}</div>
            <div class="file-size">${formatSize(file.size)}</div>
          `;

          const del = document.createElement('button');
          del.className = 'file-delete';
          del.textContent = '✕';
          del.title = '删除';
          del.addEventListener('click', function(e) {
            e.stopPropagation();
            files.splice(index, 1);
            render();
          });

          item.appendChild(icon);
          item.appendChild(info);
          item.appendChild(del);
          fileList.appendChild(item);
        });
      }

      function addFiles(newFiles) {
        for (const f of newFiles) {
          if (!files.some(existing => existing.name === f.name && existing.size === f.size)) {
            files.push(f);
          }
        }
        render();
      }

      dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        this.classList.add('dragover');
      });

      dropZone.addEventListener('dragleave', function(e) {
        e.preventDefault();
        this.classList.remove('dragover');
      });

      dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        this.classList.remove('dragover');
        const items = e.dataTransfer.files;
        if (items.length > 0) {
          addFiles(items);
        }
      });

      dropZone.addEventListener('click', function() {
        const input = document.createElement('input');
        input.type = 'file';
        input.multiple = true;
        input.accept = '*/*';
        input.style.display = 'none';
        document.body.appendChild(input);

        input.addEventListener('change', function() {
          if (this.files.length > 0) {
            addFiles(this.files);
          }
          document.body.removeChild(this);
        });

        input.click();
      });

      clearBtn.addEventListener('click', function() {
        if (files.length === 0) return;
        if (confirm('确定要清空所有文件吗？')) {
          files = [];
          render();
        }
      });

      document.addEventListener('dragover', function(e) { e.preventDefault(); });
      document.addEventListener('drop', function(e) { e.preventDefault(); });

      render();
    })();
  </script>
</body>
</html>
